<!DOCTYPE html>
<html>
  <head>
    <title>Bulb On/Off</title>
    <style>
      .bulb {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin: 20px auto;
        background-color: gray;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }
      .on {
        background-color: yellow;
        box-shadow: 0 0 50px yellow;
      }
      button {
        display: block;
        margin: 10px auto;
        padding: 10px 20px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <center><h1>Click to turn the light ON/OF</h1></center>
    <div id="bulb" class="bulb"></div>
    <button onclick="turnOn()">Turn On</button>
    <button onclick="turnOff()">Turn Off</button>

    <script>
      function turnOn() {
        document.getElementById("bulb").classList.add("on");
      }
      function turnOff() {
        document.getElementById("bulb").classList.remove("on");
      }
    </script>
  </body>
</html>
